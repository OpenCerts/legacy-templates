name: Build and Deploy to S3

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

env:
  NODE_VERSION: '14'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run lint checks
      run: npm run lint:check

    - name: Run tests
      run: npm test

  build-and-deploy:
    name: Build and Deploy to S3 (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: test
    # prod only deploys from master; dev can deploy any branch
    if: inputs.environment == 'dev' || github.ref == 'refs/heads/master'
    env:
      S3_BUCKET_NAME: ${{ inputs.environment == 'prod' && secrets.S3_BUCKET_NAME || secrets.DEV_S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ inputs.environment == 'prod' && secrets.CLOUDFRONT_DISTRIBUTION_ID || secrets.DEV_CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
    - name: Check deploy target is configured
      run: |
        if [ -z "$S3_BUCKET_NAME" ]; then
          echo "::error::No S3 bucket secret set for '${{ inputs.environment }}' (expected ${{ inputs.environment == 'prod' && 'S3_BUCKET_NAME' || 'DEV_S3_BUCKET_NAME' }})"
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build static site
      run: npm run build:static

    - name: Add CNAME file
      run: npm run cname

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.environment == 'prod' && secrets.AWS_ACCESS_KEY_ID || secrets.DEV_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ inputs.environment == 'prod' && secrets.AWS_SECRET_ACCESS_KEY || secrets.DEV_AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ inputs.environment == 'prod' && secrets.AWS_REGION || secrets.DEV_AWS_REGION || secrets.AWS_REGION }}

    - name: Sync to S3 bucket
      run: |
        aws s3 sync out/ s3://${{ env.S3_BUCKET_NAME }} --delete --cache-control max-age=31536000,public

    - name: Invalidate CloudFront distribution (optional)
      if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

